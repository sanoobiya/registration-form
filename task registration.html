<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    function ButtonClicked() {
        alert("Submitted Successfully!");
    }
</script>
</head>
<body>
     <h1>Registration Form</h1>
    <form action="">
        <table>
            <tr>
                <th>
                    Firstname:

                </th>
                <td>
                    <input type="text" name="fname" placeholder="eg:John" required minlength="3">
                </td>
            </tr>
            <tr>
                <th>
                     Lastname:
                </th>
                <td>
                <input type="text" name="lname" placeholder="eg:Doe" required minlength="3">
                </td>
            </tr>
            <tr>
                <th>
                     DOB:
                </th>
                <td>
                <input type="date" required>
                </td>
            </tr>
            <tr>
                <th>
                     Gender:
                </th>
                <td>
                <input type="radio" name="gender" id="">Male
                <input type="radio" name="gender" id="">Female
                </td>
            </tr>
            <tr>
                <th>
                     Qualification:
                </th>
                <td>
                <input type="checkbox" name="" id="">SSLC
                <input type="checkbox" name="" id="">UG
                <input type="checkbox" name="" id="">PG
                </td>
            </tr>
            <tr>
                <th>
                    Address:
                </th>
                <td>
                <textarea name="" id="" cols="50" rows="10"></textarea>
                </td>
                
            </tr>
                <th>
                    State:
                </th>
                <td>
                <select name="" id="">
                <option value="kl">Kerala</option>
                <option value="tn">Tamilnadu</option>
                <option value="ka">Karnataka</option>
                <option value="ap">Andra</option>
                </select>
                </td>
                
            </tr>
            <tr>
                <th>
                    Pincode:
                </th>
                <td>
                   <input type="text" name="pin" maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit PIN" required> 
                </td>
            </tr>
            <tr>
                <th>Email:</th>
                <td>
                    <input type="email" name="email" placeholder="eg:john@gmail.com" required >
  
                </td>
            </tr>
            <tr>
                <th>
                    Phone:
                </th>
                <td>
                    <input type="tel" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" maxlength="10" required>
                </td>
            </tr>
            <tr>
                <th>Username:</th>
                <td>
                    <input type="text" name="uname" placeholder="eg:Johndoe" required minlength="3" maxlength="12">
                 </td>
            </tr>
            <tr>
                <th>Password:</th>
                <td>
                    <input type="password" name="pswd" id="" required minlength="8" maxlength="16">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Submit" onclick="ButtonClicked()">
                    <input type="reset" value="Reset">

                </td>
            </tr>
        </table>
    </form>
</body>
</html>
